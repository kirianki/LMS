components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Collateral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_last_name:
          type: string
          readOnly: true
        collateral_type:
          $ref: '#/components/schemas/CollateralTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        market_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        forced_sale_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        valuation_date:
          type: string
          format: date
        valuer_name:
          type: string
          maxLength: 100
        document_upload:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        body_type:
          type: string
          maxLength: 50
        reg_number:
          type: string
          maxLength: 20
        chassis_number:
          type: string
          maxLength: 50
        engine_number:
          type: string
          maxLength: 50
        year_of_manufacture:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        logbook_number:
          type: string
          maxLength: 50
        lr_number:
          type: string
          title: LR/Parcel Number
          maxLength: 100
        location:
          type: string
          maxLength: 200
        property_size:
          type: string
          maxLength: 50
        tenure_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TenureTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        business_name:
          type: string
          maxLength: 100
        registration_number:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        customer:
          type: string
          format: uuid
      required:
      - created_at
      - customer
      - customer_last_name
      - customer_name
      - forced_sale_value
      - id
      - market_value
      - updated_at
      - valuation_date
    CollateralTypeEnum:
      enum:
      - motor_vehicle
      - land_property
      - business_asset
      - chattels
      - shares
      - fixed_deposit
      - other
      type: string
      description: |-
        * `motor_vehicle` - Motor Vehicle
        * `land_property` - Land/Property
        * `business_asset` - Business Asset
        * `chattels` - Household/Office Chattels
        * `shares` - Shares/Stocks
        * `fixed_deposit` - Fixed Deposit
        * `other` - Other
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        verified_by_name:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone_number:
          type: string
          maxLength: 15
        id_type:
          $ref: '#/components/schemas/IdTypeEnum'
        id_number:
          type: string
          maxLength: 50
        id_document:
          type: string
          format: uri
          nullable: true
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        employment_status:
          $ref: '#/components/schemas/EmploymentStatusEnum'
        monthly_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        crb_score:
          type: integer
          readOnly: true
          nullable: true
        internal_score:
          type: integer
          readOnly: true
        hybrid_score:
          type: integer
          readOnly: true
          nullable: true
        last_crb_check:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_verified:
          type: boolean
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        verified_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - address
      - crb_score
      - created_at
      - date_of_birth
      - first_name
      - hybrid_score
      - id
      - id_number
      - internal_score
      - is_verified
      - last_crb_check
      - last_name
      - phone_number
      - updated_at
      - verified_at
      - verified_by
      - verified_by_name
    EmploymentStatusEnum:
      enum:
      - employed
      - self_employed
      - unemployed
      - retired
      - student
      type: string
      description: |-
        * `employed` - Employed
        * `self_employed` - Self-Employed
        * `unemployed` - Unemployed
        * `retired` - Retired
        * `student` - Student
    IdTypeEnum:
      enum:
      - national_id
      - passport
      - driving_license
      - alien_id
      type: string
      description: |-
        * `national_id` - National ID
        * `passport` - Passport
        * `driving_license` - Driving License
        * `alien_id` - Alien ID
    NullEnum:
      enum:
      - null
    PatchedCollateral:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_last_name:
          type: string
          readOnly: true
        collateral_type:
          $ref: '#/components/schemas/CollateralTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        market_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        forced_sale_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        valuation_date:
          type: string
          format: date
        valuer_name:
          type: string
          maxLength: 100
        document_upload:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        body_type:
          type: string
          maxLength: 50
        reg_number:
          type: string
          maxLength: 20
        chassis_number:
          type: string
          maxLength: 50
        engine_number:
          type: string
          maxLength: 50
        year_of_manufacture:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        logbook_number:
          type: string
          maxLength: 50
        lr_number:
          type: string
          title: LR/Parcel Number
          maxLength: 100
        location:
          type: string
          maxLength: 200
        property_size:
          type: string
          maxLength: 50
        tenure_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TenureTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        business_name:
