        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collateral'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Collateral'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Collateral'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
          description: ''
    patch:
      operationId: v1_collateral_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this collateral.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCollateral'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCollateral'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCollateral'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collateral'
          description: ''
    delete:
      operationId: v1_collateral_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this collateral.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
